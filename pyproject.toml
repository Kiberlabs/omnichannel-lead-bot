[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichannel-lead-bot"
version = "0.1.0"
description = "24/7 B2B omnichannel lead qualification engine (WhatsApp/Telegram/Web) with zero-token bilingual NLU and SQLite WAL persistence by KiberLabs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KiberLabs Engineering" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lead-bot = "lead_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
